<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestLog // Daily Tracker</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --surface-color: #181820;
            --surface-hover: #22222d;
            --text-color: #e0e0e0;
            --primary: #00c3ff;
            --primary-glow: rgba(0, 195, 255, 0.4);
            --success: #00ff88;
            --success-glow: rgba(0, 255, 136, 0.4);
            --skipped: #ff4444;
            --skipped-glow: rgba(255, 68, 68, 0.4);
            --inactive: #2a2a35;
            --line-color: #1f1f28;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Auth / Login Screen --- */
        #authScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            background: radial-gradient(circle at center, #181824 0%, #0f0f13 100%);
        }

        .auth-card {
            background: var(--surface-color);
            border: 1px solid rgba(0, 195, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px var(--primary-glow);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }

        .auth-card h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .auth-card p {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: #0f0f13;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c3ff, #0077ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px var(--primary-glow);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--primary-glow);
        }

        .auth-switch {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #888;
        }

        .auth-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: bold;
        }

        .auth-switch span:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: var(--skipped);
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }

        /* --- Haupt-App (PC & Mobile optimiertes Dashboard) --- */
        #mainApp {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .app-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            box-sizing: border-box;
            background: rgba(15, 15, 19, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            border-radius: 0 0 15px 15px;
        }

        .user-info {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 600;
        }

        .logout-btn {
            background: none;
            border: 1px solid #333;
            color: #888;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .logout-btn:hover {
            color: var(--skipped);
            border-color: var(--skipped);
            background: rgba(255, 68, 68, 0.05);
        }

        .dashboard-container {
            width: 90%;
            max-width: 900px;
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        /* Auf PC zeigen wir es schön in zwei Spalten (Links Kalender/Stats, Rechts Quests) */
        @media (min-width: 768px) {
            .dashboard-container {
                grid-template-columns: 350px 1fr;
            }
        }

        .panel {
            background: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .panel h3 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .quest-item {
            background: #0f0f13;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }

        .add-quest-box {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .add-quest-box input {
            flex: 1;
            padding: 12px;
            background: #0f0f13;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }

        .add-quest-box select {
            padding: 12px;
            background: #0f0f13;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTER SCREEN -->
    <div id="authScreen">
        <div class="auth-card">
            <h1>QuestLog</h1>
            <p>Dein persönlicher Daily & Weekly Tracker</p>
            
            <div class="input-group">
                <label>E-Mail Adresse</label>
                <input type="email" id="emailInput" placeholder="name@example.com">
            </div>
            
            <div class="input-group">
                <label>Passwort</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>

            <button class="btn" id="authBtn" onclick="handleAuth()">Einloggen</button>
            <div class="error-msg" id="errorMsg">Fehler beim Login.</div>

            <div class="auth-switch">
                <span id="switchText" onclick="toggleAuthMode()">Noch keinen Account? Registrieren</span>
            </div>
        </div>
    </div>

    <!-- HAUPT-APP (Dashboard für PC & Mobile) -->
    <div id="mainApp">
        <div class="app-bar">
            <div class="user-info" id="userDisplay">Lade Profil...</div>
            <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </div>

        <div class="dashboard-container">
            <!-- Linke Spalte: Übersicht & Kalender -->
            <div class="panel">
                <h3>Übersicht</h3>
                <p style="color: #888; font-size: 0.9rem;">Hier siehst du deinen aktuellen Fortschritt und Status.</p>
                <div style="margin-top: 20px; background: #0f0f13; padding: 20px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 2rem; color: var(--success); font-weight: bold;" id="streakCount">🔥 0 Tage</div>
                    <div style="font-size: 0.85rem; color: #888; margin-top: 5px;">Aktive Streak</div>
                </div>
            </div>

            <!-- Rechte Spalte: Aktive Quests & Erstellung -->
            <div class="panel">
                <h3>Deine Quests</h3>
                <div class="add-quest-box">
                    <input type="text" id="questInput" placeholder="Neue Quest eingeben (z.B. Gym, F-Prog)...">
                    <select id="questType">
                        <option value="daily">Ttäglich</option>
                        <option value="weekly">Wöchentlich</option>
                    </select>
                    <button class="btn" style="width: auto; margin-top: 0; padding: 0 20px;" onclick="addQuest()">+</button>
                </div>

                <div class="quest-list" id="questListContainer">
                    <!-- Hier landen später dynamisch deine Quests -->
                    <div style="text-align: center; color: #666; padding: 20px;">Noch keine Quests vorhanden. Erstelle deine erste!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD9mEQPiHDtniuDbLGijbuoelpd6UUm7_s",
            authDomain: "planer-84a8f.firebaseapp.com",
            projectId: "planer-84a8f",
            storageBucket: "planer-84a8f.firebasestorage.app",
            messagingSenderId: "558142280739",
            appId: "1:558142280739:web:d5808e12a4fd4e13280d96",
            measurementId: "G-CBXT81XMZ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegisterMode = false;

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.querySelector('.auth-card h1').innerText = isRegisterMode ? 'Registrierung' : 'QuestLog';
            document.querySelector('.auth-card p').innerText = isRegisterMode ? 'Erstelle deinen Account' : 'Dein persönlicher Daily & Weekly Tracker';
            document.getElementById('authBtn').innerText = isRegisterMode ? 'Account erstellen' : 'Einloggen';
            document.getElementById('switchText').innerText = isRegisterMode ? 'Bereits einen Account? Einloggen' : 'Noch keinen Account? Registrieren';
            document.getElementById('errorMsg').style.display = 'none';
        }

        window.handleAuth = async function() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errBox = document.getElementById('errorMsg');

            errBox.style.display = 'none';

            try {
                if (isRegisterMode) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errBox.innerText = error.message;
                errBox.style.display = 'block';
            }
        }

        window.logoutUser = async function() {
            await signOut(auth);
        }

        window.addQuest = function() {
            const val = document.getElementById('questInput').value;
            if(!val) return;
            alert("Quest '" + val + "' wird im nächsten Schritt mit der Datenbank verknüpft!");
            document.getElementById('questInput').value = '';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                document.getElementById('userDisplay').innerText = `Eingeloggt als: ${user.email}`;
            } else {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });
    </script>
</body>
</html>
