<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wochen-Tracker</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --text-color: #e0e0e0;
            --primary: #00c3ff;
            --primary-glow: rgba(0, 195, 255, 0.6);
            --success: #00ff88;
            --success-glow: rgba(0, 255, 136, 0.6);
            --skipped: #ff4444;
            --skipped-glow: rgba(255, 68, 68, 0.6);
            --partial: #ffaa00;
            --partial-glow: rgba(255, 170, 0, 0.6);
            --inactive: #2a2a35;
            --line-color: #1f1f28;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- Header & App Bar --- */
        .app-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(15, 15, 19, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: 0.3s;
        }

        .menu-btn:hover {
            color: #fff;
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .current-day-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .sync-indicator {
            font-size: 0.8rem;
            color: var(--primary);
            opacity: 0;
            transition: opacity 0.3s ease;
            width: 60px;
            text-align: right;
        }

        /* --- Vollbild Menü / Monatskalender --- */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 14, 0.98);
            z-index: 100;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
        }

        .menu-overlay.open {
            left: 0;
        }

        .close-menu-btn {
            position: absolute;
            top: 25px;
            right: 30px;
            background: none;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            line-height: 1;
            transition: 0.3s;
        }

        .close-menu-btn:hover {
            color: var(--primary);
            transform: rotate(90deg);
        }

        .menu-title {
            font-size: 1.5rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0;
        }

        .calendar-wrapper {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            width: 90%;
            max-width: 400px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #888;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .cal-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--inactive);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .cal-day.empty {
            background: transparent;
            cursor: default;
        }

        .cal-day:not(.empty):hover {
            transform: translateY(-3px);
            background: #3a3a45;
        }

        .cal-day.active {
            border: 2px solid var(--primary);
            box-shadow: inset 0 0 10px rgba(0, 195, 255, 0.3);
        }

        .cal-day.completed {
            background: var(--success);
            color: #000;
            box-shadow: 0 0 15px var(--success-glow);
            border: none;
        }
        
        .cal-day.partial {
            background: var(--partial);
            color: #000;
            box-shadow: 0 0 15px var(--partial-glow);
            border: none;
        }

        /* --- Checkliste Styles --- */
        .daily-checklist {
            width: 90%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .check-title {
            color: var(--primary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .check-item:hover {
            transform: translateX(5px);
        }

        .check-box {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: transparent;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .check-item.checked .check-box {
            background: var(--success);
            border-color: var(--success);
            color: #000;
            box-shadow: 0 0 10px var(--success-glow);
            transform: scale(1.1);
        }

        .check-item.checked .check-text {
            color: var(--success);
            transition: 0.3s;
        }

        /* --- Timeline Styles --- */
        .timeline-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .timeline-wrapper::before {
            content: '';
            position: absolute;
            top: 40px;
            bottom: 40px;
            left: 48px; 
            width: 4px;
            background-color: var(--line-color);
            z-index: 0;
            border-radius: 2px;
        }

        .task-container {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
            opacity: 0.3;
            transform: translateX(-20px);
            transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
            filter: grayscale(100%);
        }

        .task-container.show {
            opacity: 0.4;
            transform: translateX(0);
        }

        .task-container.active {
            opacity: 1;
            filter: grayscale(0%);
        }

        .task-container.completed,
        .task-container.skipped {
            opacity: 0.7;
            filter: grayscale(0%);
            transform: translateX(0);
        }

        /* --- Wasser-Bubble Styles --- */
        .bubble {
            width: 60px;
            height: 60px;
            border-radius: 48% 52% 51% 49% / 51% 49% 52% 48%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            flex-shrink: 0;
            user-select: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), rgba(100, 150, 255, 0.05) 60%, rgba(0, 50, 255, 0.1) 100%);
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.5), inset 5px 5px 15px rgba(255,255,255,0.1);
            touch-action: manipulation; 
        }

        .active .bubble {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(0, 195, 255, 0.6) 50%, rgba(0, 100, 255, 0.9) 100%);
            box-shadow: inset -5px -5px 15px rgba(0,100,255,0.5), inset 5px 5px 15px rgba(255,255,255,0.8), 0 10px 25px rgba(0, 195, 255, 0.5);
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            cursor: pointer;
            transform: scale(1.15);
            animation: waterShape 4s linear infinite;
        }

        .active .bubble:hover {
            transform: scale(1.25);
            box-shadow: inset -5px -5px 15px rgba(0,100,255,0.6), inset 5px 5px 20px rgba(255,255,255,0.9), 0 15px 35px rgba(0, 195, 255, 0.7);
        }

        .completed .bubble {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(0, 255, 136, 0.6) 50%, rgba(0, 150, 100, 0.9) 100%);
            box-shadow: inset -5px -5px 15px rgba(0,100,0,0.5), inset 5px 5px 15px rgba(255,255,255,0.8), 0 5px 15px rgba(0, 255, 136, 0.3);
            color: #000;
            transform: scale(0.95);
            border-radius: 50%;
        }

        .skipped .bubble {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 68, 68, 0.6) 50%, rgba(200, 0, 0, 0.9) 100%);
            box-shadow: inset -5px -5px 15px rgba(100,0,0,0.5), inset 5px 5px 15px rgba(255,255,255,0.8), 0 5px 15px rgba(255, 68, 68, 0.3);
            color: #fff;
            transform: scale(0.95);
            border-radius: 50%;
        }

        .label {
            margin-left: 30px;
            font-size: 1.1rem;
            padding: 15px 20px;
            border-radius: 12px;
            background-color: transparent;
            transition: all 0.5s ease;
            width: 100%;
        }

        .active .label {
            font-weight: 600;
            color: #fff;
            background-color: rgba(0, 195, 255, 0.1);
            border: 1px solid rgba(0, 195, 255, 0.2);
            transform: scale(1.02) translateX(10px);
        }

        .completed .label {
            text-decoration: line-through;
            color: #666;
            background-color: rgba(0, 255, 136, 0.05);
        }

        .skipped .label {
            text-decoration: line-through;
            color: var(--skipped);
            background-color: rgba(255, 68, 68, 0.05);
        }

        @keyframes waterShape {
            0%, 100% { border-radius: 48% 52% 51% 49% / 51% 49% 52% 48%; }
            25% { border-radius: 51% 49% 48% 52% / 52% 48% 49% 51%; }
            50% { border-radius: 49% 51% 52% 48% / 48% 52% 51% 49%; }
            75% { border-radius: 52% 48% 49% 51% / 49% 51% 48% 52%; }
        }

        @keyframes splashSuccess {
            0% { transform: scale(1); border-radius: 48% 52% 51% 49%; }
            40% { transform: scale(1.25); background: var(--success); box-shadow: 0 0 30px var(--success-glow); border-radius: 50%; color: #000; }
            100% { transform: scale(0.95); background: var(--success); box-shadow: 0 0 15px var(--success-glow); border-radius: 50%; color: #000; }
        }

        @keyframes splashSkip {
            0% { transform: scale(1); border-radius: 48% 52% 51% 49%; }
            40% { transform: scale(1.15) rotate(10deg); background: var(--skipped); box-shadow: 0 0 30px var(--skipped-glow); border-radius: 50%; color: #fff; }
            100% { transform: scale(0.95) rotate(0deg); background: var(--skipped); box-shadow: 0 0 15px var(--skipped-glow); border-radius: 50%; color: #fff; }
        }

        .day-finished {
            text-align: center;
            color: var(--success);
            font-size: 1.3rem;
            margin-top: 40px;
            text-shadow: 0 0 20px var(--success-glow);
            animation: fadeIn 1s ease;
        }
        
        .day-finished.partial {
            color: var(--partial);
            text-shadow: 0 0 20px var(--partial-glow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .reset-btn {
            margin-top: 40px;
            background: transparent;
            color: #666;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .reset-btn:hover {
            color: #ff4444;
            border-color: #ff4444;
            background: rgba(255,0,0,0.1);
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .month-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .month-btn:hover { color: #fff; }

    </style>
</head>
<body>

<div class="app-bar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="current-day-title" id="currentDayTitle">Lädt...</div>
    <div class="sync-indicator" id="syncIndicator">Sync...</div>
</div>

<div class="menu-overlay" id="menuOverlay">
    <button class="close-menu-btn" onclick="toggleMenu()">×</button>
    
    <div class="calendar-wrapper">
        <div class="month-nav">
            <button class="month-btn" onclick="changeMonth(-1)">❮</button>
            <div class="menu-title" id="monthYearTitle">Monat Jahr</div>
            <button class="month-btn" onclick="changeMonth(1)">❯</button>
        </div>
        
        <div class="weekdays">
            <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <button class="reset-btn" onclick="resetCloudData()">Alle Daten löschen</button>
</div>

<div id="checklistContainer" class="daily-checklist" style="display: none;"></div>

<div class="timeline-wrapper" id="timeline"></div>

<script>
    // JSONBin Konfiguration
    const BIN_ID = "6abfebc9ac6210605a0d4333";
    const API_KEY = "$2a$10$EbIBwUxZBO18uEgpi3fcSuxASTLvCtl/TO4xNS6FmvlNfwIcvj.ei";
    const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const weeklySchedule = {
        "Montag": [
            "Arbeit e.solutions (inkl. Pendeln)",
            "Abendessen & Pause",
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Freizeit & Vorbereitung"
        ],
        "Dienstag": [
            "Frühstück",
            "Arbeit e.solutions",
            "Mittagspause",
            "Arbeit e.solutions",
            "Vorbereitung Mittwoch",
            "Abendessen & Pause",
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Freizeit"
        ],
        "Mittwoch": [
            "Vorlesung: FInf-Sto",
            "Selbststudium: Datenbank",
            "Gym – Training 1 & Essen",
            "Vorlesung: FInf-EmbSwe",
            "Selbststudium: EmbSwe",
            "Abendessen & Pause",
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Freizeit"
        ],
        "Donnerstag": [
            "Vorlesung: FInf-EmbSwe-P",
            "Vorlesung: FInf-Sto",
            "Vorlesung: FInf-EmbSwe-P",
            "Mittagspause",
            "Vorlesung: FInf-EmbSwe",
            "Vorlesung: FInf-EmbSwe-P",
            "Abendessen & Pause",
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Freizeit"
        ],
        "Freitag": [
            "Selbststudium: Datenbank",
            "Gym – Training 2",
            "Mittagessen & Duschen",
            "Vorlesung: FInf-Sto-Ü",
            "Selbststudium: Sto",
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Freizeit"
        ],
        "Samstag": [
            "Gym – Training 3",
            "Duschen & Mittagessen",
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Selbststudium: EmbSwe",
            "Wocheneinkauf",
            "Meal-Prep",
            "Freizeit"
        ],
        "Sonntag": [
            "F Prog – Programmieren",
            "BWL – Anki Karten",
            "Selbststudium: Sto",
            "Ausflug nach Bamberg & Freizeit"
        ]
    };

    const dayNames = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
    const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];

    let currentDate = new Date();
    let calendarDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1); 

    let progress = {};
    let checklistProgress = {};

    function getDateKey(dateObj) {
        return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }

    const calendarGrid = document.getElementById('calendarGrid');
    const timeline = document.getElementById('timeline');
    const menuOverlay = document.getElementById('menuOverlay');
    const topTitle = document.getElementById('currentDayTitle');
    const monthYearTitle = document.getElementById('monthYearTitle');
    const checklistContainer = document.getElementById('checklistContainer');
    const syncIndicator = document.getElementById('syncIndicator');

    // --- Cloud Sync Funktionen ---
    async function loadDataFromCloud() {
        try {
            const response = await fetch(BIN_URL, {
                headers: { 'X-Master-Key': API_KEY }
            });
            if (!response.ok) throw new Error("Netzwerkfehler");
            
            const data = await response.json();
            if (data.record) {
                progress = data.record.monthlyTrackerData || {};
                checklistProgress = data.record.dailyChecklistData || {};
            }

            // Migration alter Zahlen-Daten in Arrays (falls vorhanden)
            for (let key in progress) {
                if (typeof progress[key] === 'number') {
                    progress[key] = Array(progress[key]).fill('completed');
                }
            }

        } catch (error) {
            console.error("Fehler beim Laden aus JSONBin:", error);
            // Fallback auf lokale Daten bei Netzwerkfehler
            progress = JSON.parse(localStorage.getItem('monthlyTrackerData')) || {};
            checklistProgress = JSON.parse(localStorage.getItem('dailyChecklistData')) || {};
        }

        // UI nach dem Laden anzeigen
        checklistContainer.style.display = 'flex';
        updateAppTitle();
        renderTasks();
        buildCalendar();
    }

    async function saveDataToCloud() {
        syncIndicator.style.opacity = '1'; // "Sync..." anzeigen
        
        // Lokales Backup (falls das Internet ausfällt)
        localStorage.setItem('monthlyTrackerData', JSON.stringify(progress));
        localStorage.setItem('dailyChecklistData', JSON.stringify(checklistProgress));

        try {
            await fetch(BIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({
                    monthlyTrackerData: progress,
                    dailyChecklistData: checklistProgress
                })
            });
        } catch (error) {
            console.error("Fehler beim Speichern in JSONBin:", error);
        }

        setTimeout(() => { syncIndicator.style.opacity = '0'; }, 500);
    }
    // -----------------------------

    function toggleMenu() {
        calendarDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1); 
        buildCalendar();
        menuOverlay.classList.toggle('open');
    }

    function changeMonth(offset) {
        calendarDate.setMonth(calendarDate.getMonth() + offset);
        buildCalendar();
    }

    function selectDate(year, month, day) {
        currentDate = new Date(year, month, day);
        toggleMenu(); 
        updateAppTitle();
        renderTasks();
    }

    function updateAppTitle() {
        const dayName = dayNames[currentDate.getDay()];
        const dateStr = `${currentDate.getDate()}. ${monthNames[currentDate.getMonth()]}`;
        topTitle.innerText = `${dayName}, ${dateStr}`;
    }

    function buildCalendar() {
        calendarGrid.innerHTML = '';
        
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        
        monthYearTitle.innerText = `${monthNames[month]} ${year}`;
        
        let firstDayIndex = new Date(year, month, 1).getDay();
        let startOffset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
        
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < startOffset; i++) {
            const emptyDiv = document.createElement('div');
            emptyDiv.className = 'cal-day empty';
            calendarGrid.appendChild(emptyDiv);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const loopDate = new Date(year, month, i);
            const dateKey = getDateKey(loopDate);
            const dayName = dayNames[loopDate.getDay()];
            const tasksForThisDay = weeklySchedule[dayName] || [];
            
            const dayProgress = progress[dateKey] || [];
            const checkData = checklistProgress[dateKey] || { prayers: false, noHarakat: false };
            
            const isTasksFinished = tasksForThisDay.length > 0 && dayProgress.length >= tasksForThisDay.length;
            const allTasksCompleted = isTasksFinished && dayProgress.every(status => status === 'completed');
            const checksCompleted = checkData.prayers && checkData.noHarakat;

            const isSelected = dateKey === getDateKey(currentDate);

            const dayDiv = document.createElement('div');
            
            let calClass = 'cal-day ';
            if (isSelected) calClass += 'active ';
            
            if (isTasksFinished) {
                if (allTasksCompleted && checksCompleted) {
                    calClass += 'completed '; 
                } else {
                    calClass += 'partial '; 
                }
            }

            dayDiv.className = calClass;
            dayDiv.innerText = i;
            dayDiv.onclick = () => selectDate(year, month, i);
            calendarGrid.appendChild(dayDiv);
        }
    }

    function renderChecklist() {
        const dateKey = getDateKey(currentDate);
        if (!checklistProgress[dateKey]) {
            checklistProgress[dateKey] = { prayers: false, noHarakat: false };
        }
        const data = checklistProgress[dateKey];

        checklistContainer.innerHTML = `
            <div class="check-title">Tägliche Basics</div>
            <div class="check-item ${data.prayers ? 'checked' : ''}" id="check-prayers">
                <div class="check-box">${data.prayers ? '✓' : ''}</div>
                <div class="check-text">Alle 5 Gebete verrichtet</div>
            </div>
            <div class="check-item ${data.noHarakat ? 'checked' : ''}" id="check-harakat">
                <div class="check-box">${data.noHarakat ? '✓' : ''}</div>
                <div class="check-text">Kein Harkat</div>
            </div>
        `;

        document.getElementById('check-prayers').onclick = function() { toggleCheck('prayers', this); };
        document.getElementById('check-harakat').onclick = function() { toggleCheck('noHarakat', this); };
    }

    function toggleCheck(key, element) {
        const dateKey = getDateKey(currentDate);
        checklistProgress[dateKey][key] = !checklistProgress[dateKey][key];
        
        saveDataToCloud(); // In Cloud speichern
        
        if (checklistProgress[dateKey][key]) {
            element.classList.add('checked');
            element.querySelector('.check-box').innerText = '✓';
        } else {
            element.classList.remove('checked');
            element.querySelector('.check-box').innerText = '';
        }

        buildCalendar(); 
        checkDayCompleteInPlace();
    }

    let clickTimer = null;

    function renderTasks() {
        renderChecklist(); 
        timeline.innerHTML = ''; 
        
        const dateKey = getDateKey(currentDate);
        const dayName = dayNames[currentDate.getDay()];
        const tasks = weeklySchedule[dayName] || [];
        
        if (!progress[dateKey]) {
            progress[dateKey] = [];
        }
        
        const dayProgress = progress[dateKey];
        const currentIndex = dayProgress.length;

        if (tasks.length === 0) {
             timeline.innerHTML = '<div style="text-align:center; color:#888; margin-top:50px;">Keine Aufgaben für heute!</div>';
             return;
        }

        tasks.forEach((task, index) => {
            const container = document.createElement('div');
            container.className = 'task-container';
            container.id = 'task-' + index;
            
            setTimeout(() => {
                container.classList.add('show');
            }, index * 100);

            if (index < currentIndex) {
                container.classList.add(dayProgress[index]); 
            } else if (index === currentIndex) {
                container.classList.add('active');
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (index < currentIndex) {
                bubble.innerHTML = dayProgress[index] === 'completed' ? '✓' : '✕';
            } else {
                bubble.innerHTML = (index + 1);
            }

            if (index === currentIndex) {
                attachBubbleClick(bubble, container, dateKey, index, tasks.length);
            }

            const label = document.createElement('div');
            label.className = 'label';
            label.innerText = task;

            container.appendChild(bubble);
            container.appendChild(label);
            timeline.appendChild(container);
        });

        if (currentIndex >= tasks.length) {
            appendDayCompleteMessage();
            checkDayCompleteInPlace();
        }
    }

    function attachBubbleClick(bubble, container, dateKey, index, totalTasks) {
        bubble.onclick = (e) => {
            e.preventDefault();
            if (clickTimer === null) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    completeTaskInPlace('completed', bubble, container, dateKey, index, totalTasks);
                }, 300); 
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                completeTaskInPlace('skipped', bubble, container, dateKey, index, totalTasks);
            }
        };
    }

    function completeTaskInPlace(status, bubbleElement, containerElement, dateKey, index, totalTasks) {
        progress[dateKey].push(status);
        
        saveDataToCloud(); // In Cloud speichern

        containerElement.classList.remove('active');
        containerElement.classList.add(status);
        bubbleElement.innerHTML = status === 'completed' ? '✓' : '✕';
        bubbleElement.onclick = null; 
        
        if (status === 'skipped') {
            bubbleElement.style.animation = "splashSkip 0.4s ease-out forwards";
        } else {
            bubbleElement.style.animation = "splashSuccess 0.4s ease-out forwards";
        }

        const nextIndex = index + 1;
        if (nextIndex < totalTasks) {
            const nextContainer = document.getElementById('task-' + nextIndex);
            if (nextContainer) {
                const nextBubble = nextContainer.querySelector('.bubble');
                nextContainer.classList.add('active');
                attachBubbleClick(nextBubble, nextContainer, dateKey, nextIndex, totalTasks);
                
                setTimeout(() => {
                    nextContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 200);
            }
        } else {
            appendDayCompleteMessage();
            checkDayCompleteInPlace();
        }

        buildCalendar();
    }

    function appendDayCompleteMessage() {
        if (!document.getElementById('finishMessage')) {
            const finishMsg = document.createElement('div');
            finishMsg.id = 'finishMessage';
            finishMsg.className = 'day-finished';
            timeline.appendChild(finishMsg);
        }
    }

    function checkDayCompleteInPlace() {
        const dateKey = getDateKey(currentDate);
        const dayProgress = progress[dateKey] || [];
        const tasks = weeklySchedule[dayNames[currentDate.getDay()]] || [];
        
        if (dayProgress.length < tasks.length || tasks.length === 0) return;

        const checkData = checklistProgress[dateKey] || { prayers: false, noHarakat: false };
        const checksCompleted = checkData.prayers && checkData.noHarakat;
        const allCompleted = dayProgress.every(status => status === 'completed');
        
        const finishMsg = document.getElementById('finishMessage');
        if (!finishMsg) return;

        if (allCompleted && checksCompleted) {
            finishMsg.className = 'day-finished';
            finishMsg.innerHTML = "✨ Tag perfekt abgeschlossen! ✨";
        } else if (allCompleted && !checksCompleted) {
            finishMsg.className = 'day-finished partial';
            finishMsg.innerHTML = "🏁 Aufgaben fertig. Vergiss nicht die Checkliste oben abzuhaken!";
        } else {
            finishMsg.className = 'day-finished partial';
            finishMsg.innerHTML = "🏁 Tag beendet (mit übersprungenen Aufgaben oder fehlender Checkliste).";
        }
    }
    
    function resetCloudData() {
        if(confirm("Willst du wirklich ALLE gespeicherten Daten (Aufgaben & Checkliste) in der Cloud löschen?")) {
            progress = {};
            checklistProgress = {};
            saveDataToCloud(); // Löschung in die Cloud schießen
            buildCalendar(); 
            renderTasks();
            toggleMenu();
        }
    }

    // App-Start
    topTitle.innerText = "Lade Daten...";
    loadDataFromCloud();
</script>

</body>
</html>
