<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101020">
  <title>QuestLog · Kurz offline</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#101216;color:#f2f4f7;font-family:Inter,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,420px);text-align:center}img{width:76px;height:76px;border-radius:20px;box-shadow:0 14px 44px #c3f75f15}small{display:block;margin:26px 0 12px;color:#c3f75f;letter-spacing:2px;font-size:11px}h1{font-size:30px;line-height:1.2;letter-spacing:-1px;margin:0 0 18px}p{color:#a7afba;line-height:1.7;font-size:15px}button{background:#c3f75f;color:#1a240c;border:0;border-radius:12px;padding:14px 24px;font:700 14px Inter,"Segoe UI",Arial,sans-serif;cursor:pointer;margin:16px 0 4px}button:focus-visible{outline:2px solid #6fdaec;outline-offset:5px}.foot{font-size:12px;color:#7f8996;margin-top:26px}
    @font-face{font-family:QuestPixel;src:url('fonts/PixelifySans.ttf') format('truetype');font-weight:400 700;font-display:swap}body{background:#101020;color:#f2f4ff}main{padding:28px 22px;background:#1c2034;border:2px solid #48516f;box-shadow:5px 5px 0 #090d1b}img{border-radius:4px}h1{font-family:QuestPixel,Consolas,monospace;letter-spacing:0;font-size:34px}button{border-radius:3px;border:2px solid #defca6;box-shadow:0 4px 0 #526c35}
    img{image-rendering:pixelated}
  </style>
</head>
<body><main><img src="icons/questlog-pixel-192.png" width="76" height="76" alt="QuestLog"><small>DEIN ABENTEUER WARTET</small><h1>Du bist gerade offline.</h1><p>Verbinde dich mit dem Internet, um dich anzumelden und deine Quests zu laden oder zu speichern.</p><button id="retry" type="button">Erneut versuchen</button><p class="foot" id="offlineHint" role="status">Dein gespeicherter Fortschritt bleibt in deinem Konto.</p></main>
<script>
  const retry=document.getElementById('retry');
  retry.onclick=()=>{retry.textContent='Verbinde …';location.replace(new URL('./',location.href).href)};
  window.addEventListener('online',()=>{document.getElementById('offlineHint').textContent='Du bist wieder online. Tippe auf „Erneut versuchen“.'});
</script></body></html>
